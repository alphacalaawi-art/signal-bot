<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal Bot</title>
<style>
  :root {
    --bg: #0c0f0a; --bg-panel: #12160f; --line: #2a3324;
    --ink: #d9e0d1; --ink-dim: #7c8a72;
    --buy: #8fd14f; --sell: #e2583e; --amber: #d4a53f;
    --mono: "IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace;
    --sans: "IBM Plex Sans", -apple-system, Segoe UI, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  header { padding: 24px 28px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-family: var(--mono); font-size: 20px; margin: 0; }
  header h1 span { color: var(--amber); }
  .meta { font-family: var(--mono); font-size: 12px; color: var(--ink-dim); margin-top: 6px; }
  .status-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--buy); margin-right: 6px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  main { max-width: 900px; margin: 0 auto; padding: 20px 24px 60px; }
  .empty { color: var(--ink-dim); font-family: var(--mono); font-size: 14px; padding: 50px 0; text-align: center; border: 1px dashed var(--line); border-radius: 4px; }
  .row { display: grid; grid-template-columns: 80px 90px 1fr 90px 70px; gap: 14px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .row.head { font-family: var(--mono); font-size: 11px; color: var(--ink-dim); }
  .tag { font-family: var(--mono); font-weight: 600; font-size: 12px; padding: 3px 8px; border-radius: 3px; width: fit-content; }
  .tag.BUY { background: rgba(143,209,79,.12); color: var(--buy); }
  .tag.SELL { background: rgba(226,88,62,.12); color: var(--sell); }
  .symbol { font-family: var(--mono); font-weight: 600; }
  .price { font-family: var(--mono); color: var(--ink-dim); }
  .reasons { color: var(--ink-dim); font-size: 12px; }
  .conf { font-family: var(--mono); text-align: right; }
  footer { text-align: center; color: var(--ink-dim); font-family: var(--mono); font-size: 11px; padding: 20px 0 40px; }
</style>
</head>
<body>
<header>
  <h1>signal<span>·</span>bot</h1>
  <div class="meta"><span class="status-dot"></span>live — forex &amp; crypto</div>
</header>
<main>
  <div id="tableWrap"><div class="empty">Xogta ayaa soo shubmaysa...</div></div>
</main>
<footer>refreshes every 15s</footer>
<script>
function renderTable(signals) {
  const wrap = document.getElementById("tableWrap");
  if (!signals.length) {
    wrap.innerHTML = '<div class="empty">Weli signal lama helin</div>';
    return;
  }
  let html = '<div class="row head"><div>action</div><div>symbol</div><div>reasons</div><div>price</div><div>conf</div></div>';
  signals.forEach(s => {
    html += `<div class="row">
      <div><span class="tag ${s.action}">${s.action}</span></div>
      <div class="symbol">${s.symbol}</div>
      <div class="reasons">${s.reasons.join(" · ")}</div>
      <div class="price">${s.price}</div>
      <div class="conf">${s.confidence}%</div>
    </div>`;
  });
  wrap.innerHTML = html;
}
async function loadSignals() {
  try {
    const res = await fetch("/api/signals");
    renderTable(await res.json());
  } catch (e) { console.error(e); }
}
loadSignals();
setInterval(loadSignals, 15000);
</script>
</body>
</html>
